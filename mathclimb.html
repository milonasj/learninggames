<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dff1ff;
    --panel: #ffffff;
    --ink: #1f2a44;
    --soft: #5a6785;
    --sun: #ffc83d;
    --grass: #2fa862;
    --berry: #e0406f;
    --sky-deep: #3a86d6;
    --rock: #9fb6cf;
    --line: #c7dcef;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13213a; --panel: #1d2e4d; --ink: #eaf2ff; --soft: #a9b8d4;
      --sun: #ffd25e; --grass: #4fcf86; --berry: #ff6b95; --sky-deep: #6fb0f5;
      --rock: #4c6584; --line: #2f4468; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13213a; --panel: #1d2e4d; --ink: #eaf2ff; --soft: #a9b8d4;
    --sun: #ffd25e; --grass: #4fcf86; --berry: #ff6b95; --sky-deep: #6fb0f5;
    --rock: #4c6584; --line: #2f4468; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    font-size: 1.15rem; line-height: 1.4;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1rem 1rem 2rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem; }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -.01em; }
  .icon-btn {
    background: var(--panel); color: var(--ink); border: 2px solid var(--line);
    border-radius: 999px; font: inherit; font-size: 1.2rem; width: 2.75rem; height: 2.75rem; cursor: pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 4px solid var(--sky-deep); outline-offset: 3px;
  }
  .panel { background: var(--panel); border-radius: 24px; padding: 1.25rem; border: 2px solid var(--line); }
  .hidden { display: none !important; }

  /* Start screen */
  .mountain { width: 100%; height: auto; display: block; margin: .25rem 0 .5rem; }
  .now { text-align: center; margin: .25rem 0 1rem; }
  .now strong { display: block; font-size: 1.7rem; line-height: 1.1; }
  .now span { color: var(--soft); }
  .big-btn {
    display: block; width: 100%; font: inherit; font-weight: 800; font-size: 1.6rem;
    padding: .7rem 1rem; border-radius: 18px; border: none; cursor: pointer;
    background: var(--grass); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18);
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  details { margin-top: 1.25rem; color: var(--soft); }
  summary { cursor: pointer; font-weight: 700; }
  .settings { display: grid; gap: .75rem; margin-top: .75rem; }
  .settings label { display: grid; gap: .2rem; font-size: 1rem; color: var(--ink); }
  .settings select {
    font: inherit; font-size: 1rem; padding: .4rem .6rem; border-radius: 10px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  }

  /* Play screen */
  .topline { display: flex; justify-content: space-between; align-items: center; gap: .5rem; color: var(--soft); font-weight: 700; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dot.right { background: var(--grass); }
  .dot.wrong { background: var(--berry); }
  .dot.current { box-shadow: 0 0 0 3px var(--sky-deep); }
  .timer { height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; margin: .9rem 0 .25rem; }
  .timer-fill { height: 100%; width: 100%; background: var(--sun); border-radius: 999px; }
  .timer-fill.low { background: var(--berry); }
  .secs { text-align: right; font-weight: 700; color: var(--soft); font-size: 1rem; min-height: 1.4em; }
  .problem {
    text-align: center; font-weight: 800; font-size: clamp(3.2rem, 15vw, 5.5rem);
    line-height: 1; margin: .5rem 0 1rem; font-variant-numeric: tabular-nums;
  }
  .feedback { text-align: center; font-weight: 800; font-size: 1.5rem; min-height: 2.2rem; }
  .feedback.good { color: var(--grass); }
  .feedback.bad { color: var(--berry); }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
  .choices.five { grid-template-columns: repeat(3, 1fr); }
  .choice {
    font: inherit; font-weight: 800; font-size: 2.2rem; padding: .5rem 0;
    border-radius: 18px; border: 3px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer; box-shadow: 0 4px 0 var(--line);
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .choice.is-right { background: var(--grass); border-color: var(--grass); color: #fff; }
  .choice.is-wrong { background: var(--berry); border-color: var(--berry); color: #fff; }
  .type-area { display: grid; gap: .75rem; justify-items: center; }
  .answer-input {
    font: inherit; font-weight: 800; font-size: 2.6rem; width: 9rem; text-align: center;
    border-radius: 18px; border: 3px solid var(--sky-deep); background: var(--bg); color: var(--ink); padding: .2rem;
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 4.5rem); gap: .5rem; }
  .key {
    font: inherit; font-weight: 800; font-size: 1.7rem; height: 3.6rem; border-radius: 14px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  }
  .key.zero { grid-column: span 2; }
  .key.go {
    grid-column: 1 / -1; height: 4rem; font-size: 1.7rem;
    background: var(--grass); color: #fff; border-color: var(--grass);
    box-shadow: 0 5px 0 rgba(0,0,0,.18); margin-top: .25rem;
  }
  .key.go:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .key.go.ready { animation: glow 1.1s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(47,168,98,.0); }
    50% { box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 0 0 9px rgba(47,168,98,.35); }
  }
  @media (prefers-reduced-motion: reduce) { .key.go.ready { animation: none; outline: 4px solid var(--sun); } }
  .type-hint { text-align: center; font-weight: 700; color: var(--soft); font-size: 1.05rem; margin: 0; }
  .switch-mode {
    display: block; margin: 1rem auto 0; font: inherit; font-size: 1rem; font-weight: 700;
    background: none; border: none; color: var(--sky-deep); cursor: pointer; text-decoration: underline;
  }

  /* Results */
  .result { text-align: center; }
  .score { font-size: 3.5rem; font-weight: 800; line-height: 1; margin: .25rem 0; }
  .stars { font-size: 1.6rem; letter-spacing: .1em; margin-bottom: .5rem; }
  .result p { margin: .25rem 0 1.25rem; font-size: 1.3rem; }
  .misses { text-align: left; margin: 0 0 1.25rem; padding: .75rem 1rem; border-radius: 16px; background: var(--bg); }
  .misses h2 { font-size: 1.1rem; margin: 0 0 .25rem; color: var(--soft); }
  .misses ul { margin: 0; padding-left: 1.2rem; font-weight: 700; font-size: 1.3rem; }
  .ghost-btn {
    display: block; width: 100%; margin-top: .75rem; font: inherit; font-weight: 700; font-size: 1.1rem;
    padding: .5rem; border-radius: 14px; border: 2px solid var(--line); background: none; color: var(--ink); cursor: pointer;
  }

  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s ease-out; }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  @media (max-width: 380px) {
    .keypad { grid-template-columns: repeat(3, 4rem); }
    .choice { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Math Climb</h1>
    <button class="icon-btn" id="muteBtn" aria-label="Turn sound off">🔊</button>
  </header>

  <!-- START -->
  <section id="startScreen" class="panel">
    <svg class="mountain" id="mountain" viewBox="0 0 320 170" role="img" aria-label="Mountain showing your level"></svg>
    <div class="now">
      <strong id="nowLevel">Level 1</strong>
      <span id="nowDetail">Facts to 10 with 3 choices</span>
    </div>
    <button class="big-btn" id="startBtn">Start climbing</button>
    <details>
      <summary>Grown-ups</summary>
      <div class="settings">
        <label>Level
          <select id="setLevel"></select>
        </label>
        <label>Answer style
          <select id="setStage">
            <option value="0">3 choices</option>
            <option value="1">5 choices</option>
            <option value="2">Type the answer</option>
          </select>
        </label>
        <label>Countdown
          <select id="setTimer">
            <option value="normal">Normal</option>
            <option value="relaxed">Relaxed (50% more time)</option>
            <option value="off">Off</option>
          </select>
        </label>
      </div>
    </details>
  </section>

  <!-- PLAY -->
  <section id="playScreen" class="panel hidden">
    <div class="topline">
      <span id="playLevel">Level 1</span>
      <div class="dots" id="dots" aria-label="Progress"></div>
    </div>
    <div class="timer" id="timerBar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="secs" id="secs"></div>
    <div class="problem" id="problem" aria-live="polite">3 + 4</div>
    <div class="feedback" id="feedback" aria-live="assertive"></div>
    <div class="choices" id="choices"></div>
    <div class="type-area hidden" id="typeArea">
      <p class="type-hint">Type your answer, then press the green Check button.</p>
      <input class="answer-input" id="answerInput" type="text" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Your answer">
      <div class="keypad" id="keypad"></div>
    </div>
    <button class="switch-mode" id="switchMode">Type it instead</button>
  </section>

  <!-- RESULTS -->
  <section id="resultScreen" class="panel hidden">
    <div class="result">
      <div class="score" id="score">8 / 10</div>
      <div class="stars" id="stars"></div>
      <p id="resultMsg"></p>
      <div class="misses hidden" id="misses">
        <h2>Ones to practice</h2>
        <ul id="missList"></ul>
      </div>
      <button class="big-btn" id="againBtn">Play again</button>
      <button class="ghost-btn" id="homeBtn">Back to the mountain</button>
    </div>
  </section>
</div>

<script>
(function () {
  const MINUS = "\u2212";
  const ROUND_LEN = 10;
  const PASS = 8;
  const STREAK_NEEDED = 3; // passing rounds in a row to step up
  const DROP = 6; // fewer than this right drops back to 3 choices

  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rand(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // Each generator returns { a, b, op, ans }
  const LEVELS = [
    { name: "Facts to 10", time: 12, gen() {
        if (Math.random() < .5) { const a = rand(0, 10); const b = rand(0, 10 - a); return { a, b, op: "+", ans: a + b }; }
        const a = rand(1, 10); const b = rand(0, a); return { a, b, op: "-", ans: a - b };
    }},
    { name: "Facts to 20", time: 12, gen() {
        if (Math.random() < .5) { const a = rand(2, 10); const b = rand(Math.max(2, 11 - a), 10); return { a, b, op: "+", ans: a + b }; }
        const a = rand(11, 20); const b = rand(a - 10, 9); return { a, b, op: "-", ans: a - b };
    }},
    { name: "Big number + small number", time: 15, gen() {
        const tens = rand(1, 9), ones = rand(0, 8);
        const a = tens * 10 + ones;
        if (Math.random() < .5) { const b = rand(1, 9 - ones); return { a, b, op: "+", ans: a + b }; }
        const o = rand(1, 9); const a2 = tens * 10 + o; const b = rand(1, o); return { a: a2, b, op: "-", ans: a2 - b };
    }},
    { name: "Crossing a ten", time: 20, gen() {
        if (Math.random() < .5) {
          const tens = rand(1, 8), ones = rand(2, 9); const a = tens * 10 + ones;
          const b = rand(10 - ones, 9); return { a, b, op: "+", ans: a + b };
        }
        const tens = rand(2, 9), ones = rand(0, 7); const a = tens * 10 + ones;
        const b = rand(ones + 1, 9); return { a, b, op: "-", ans: a - b };
    }},
    { name: "Two big numbers", time: 25, gen() {
        if (Math.random() < .5) { const a = rand(10, 89); const b = rand(10, 99 - a); return { a, b, op: "+", ans: a + b }; }
        const a = rand(20, 99); const b = rand(10, a - 1); return { a, b, op: "-", ans: a - b };
    }}
  ];
  const STAGES = [
    { label: "3 choices", choices: 3 },
    { label: "5 choices", choices: 5 },
    { label: "typing the answer", choices: 0 }
  ];

  // ----- Saved progress -----
  const KEY = "math-climb-v1";
  let save = { level: 0, stage: 0, streak: 0, timer: "normal", muted: false };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) save = Object.assign(save, s); } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  // ----- Elements -----
  const $ = id => document.getElementById(id);
  const screens = { start: $("startScreen"), play: $("playScreen"), result: $("resultScreen") };
  const show = name => Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));

  // ----- Sound -----
  let audio = null;
  function tones(freqs, gap = .12) {
    if (save.muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      freqs.forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * gap;
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, t + .2);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .22);
      });
    } catch (e) {}
  }
  const sounds = { right: () => tones([660, 880]), wrong: () => tones([300, 220], .15), win: () => tones([523, 659, 784, 1047]) };
  function paintMute() { $("muteBtn").textContent = save.muted ? "🔇" : "🔊"; $("muteBtn").setAttribute("aria-label", save.muted ? "Turn sound on" : "Turn sound off"); }
  $("muteBtn").addEventListener("click", () => { save.muted = !save.muted; persist(); paintMute(); });

  // ----- Start screen -----
  const LEDGES = [[42, 148], [100, 120], [158, 92], [214, 64], [266, 36]];
  function drawMountain() {
    let s = `<path d="M0 170 L60 128 L110 112 L170 78 L230 50 L270 22 L320 70 L320 170 Z" fill="var(--rock)"/>`;
    s += `<path d="M248 38 L270 22 L292 42 L278 40 L270 46 L260 40 Z" fill="var(--panel)" opacity=".9"/>`;
    LEDGES.forEach(([x, y], i) => {
      const done = i < save.level, here = i === save.level;
      s += `<circle cx="${x}" cy="${y}" r="${here ? 15 : 12}" fill="${done ? "var(--sun)" : here ? "var(--grass)" : "var(--panel)"}" stroke="var(--ink)" stroke-width="2.5"/>`;
      s += `<text x="${x}" y="${y + 6}" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="16" fill="${here ? "#fff" : "var(--ink)"}">${i + 1}</text>`;
    });
    const [fx, fy] = LEDGES[4];
    s += `<line x1="${fx}" y1="${fy - 14}" x2="${fx}" y2="${fy - 34}" stroke="var(--ink)" stroke-width="2.5"/>`;
    s += `<path d="M${fx} ${fy - 34} L${fx + 18} ${fy - 28} L${fx} ${fy - 22} Z" fill="var(--berry)"/>`;
    $("mountain").innerHTML = s;
  }
  function paintStart() {
    $("nowLevel").textContent = `Level ${save.level + 1}`;
    $("nowDetail").textContent = `${LEVELS[save.level].name} with ${STAGES[save.stage].label}` +
      (save.streak ? ` \u2022 ${save.streak} of ${STREAK_NEEDED} great rounds in a row` : "");
    $("setLevel").value = save.level; $("setStage").value = save.stage; $("setTimer").value = save.timer;
    drawMountain();
  }
  LEVELS.forEach((l, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${i + 1}: ${l.name}`; $("setLevel").appendChild(o); });
  $("setLevel").addEventListener("change", e => { save.level = +e.target.value; save.streak = 0; persist(); paintStart(); });
  $("setStage").addEventListener("change", e => { save.stage = +e.target.value; save.streak = 0; persist(); paintStart(); });
  $("setTimer").addEventListener("change", e => { save.timer = e.target.value; persist(); });

  // ----- Keypad -----
  ["1","2","3","4","5","6","7","8","9","0","⌫","✓"].forEach(k => {
    const b = document.createElement("button");
    b.className = "key" + (k === "✓" ? " go" : k === "0" ? " zero" : "");
    b.textContent = k === "✓" ? "Check ✓" : k;
    if (k === "✓") b.id = "checkKey";
    b.setAttribute("aria-label", k === "⌫" ? "Erase" : k === "✓" ? "Check answer" : k);
    b.addEventListener("click", () => {
      const inp = $("answerInput");
      if (k === "⌫") inp.value = inp.value.slice(0, -1);
      else if (k === "✓") submitTyped();
      else if (inp.value.length < 3) inp.value += k;
      updateReady();
    });
    $("keypad").appendChild(b);
  });
  function updateReady() { $("checkKey").classList.toggle("ready", $("answerInput").value !== ""); }
  $("answerInput").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); updateReady(); });
  $("answerInput").addEventListener("keydown", e => { if (e.key === "Enter") submitTyped(); });

  // ----- Round -----
  let round = null, timerId = null;

  function startRound() {
    round = { i: 0, score: 0, results: [], misses: [], typing: STAGES[save.stage].choices === 0, locked: false, last: "" };
    $("playLevel").textContent = `Level ${save.level + 1}`;
    $("dots").innerHTML = Array.from({ length: ROUND_LEN }, () => `<span class="dot"></span>`).join("");
    show("play");
    nextQuestion();
  }

  function newProblem() {
    let p, key, tries = 0;
    do { p = LEVELS[save.level].gen(); key = `${p.a}${p.op}${p.b}`; tries++; } while (key === round.last && tries < 10);
    round.last = key; return p;
  }

  function makeChoices(ans, n) {
    const big = save.level >= 2;
    const offsets = shuffle(big ? [1, -1, 10, -10, 2, -2, 9, -9, 11, -11] : [1, -1, 2, -2, 3, -3]);
    const set = new Set([ans]);
    for (const o of offsets) { if (set.size >= n) break; const v = ans + o; if (v >= 0 && v <= (big ? 110 : 20)) set.add(v); }
    while (set.size < n) set.add(ans + set.size + 3);
    return shuffle([...set]);
  }

  function paintDots() {
    [...$("dots").children].forEach((d, i) => {
      d.className = "dot" + (round.results[i] === true ? " right" : round.results[i] === false ? " wrong" : "") + (i === round.i ? " current" : "");
    });
  }

  function nextQuestion() {
    if (round.i >= ROUND_LEN) return finishRound();
    round.locked = false;
    const p = round.p = newProblem();
    $("problem").textContent = `${p.a} ${p.op === "+" ? "+" : MINUS} ${p.b}`;
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    paintDots();

    const stageChoices = STAGES[save.stage].choices;
    $("switchMode").classList.toggle("hidden", stageChoices === 0);
    $("switchMode").textContent = round.typing ? "Show choices" : "Type it instead";

    if (round.typing) {
      $("choices").classList.add("hidden"); $("typeArea").classList.remove("hidden");
      $("answerInput").value = ""; updateReady(); $("answerInput").focus({ preventScroll: true });
    } else {
      $("typeArea").classList.add("hidden"); $("choices").classList.remove("hidden");
      const box = $("choices"); box.innerHTML = "";
      makeChoices(p.ans, stageChoices).forEach(v => {
        const b = document.createElement("button"); b.className = "choice"; b.textContent = v;
        b.addEventListener("click", () => answer(v, b)); box.appendChild(b);
      });
    }
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    const bar = $("timerBar"), fill = $("timerFill");
    if (save.timer === "off") { bar.classList.add("hidden"); $("secs").textContent = ""; return; }
    bar.classList.remove("hidden");
    let limit = LEVELS[save.level].time + (round.typing ? 3 : 0);
    if (save.timer === "relaxed") limit = Math.round(limit * 1.5);
    const end = performance.now() + limit * 1000;
    const tick = () => {
      const left = Math.max(0, end - performance.now());
      fill.style.width = (left / (limit * 1000) * 100) + "%";
      fill.classList.toggle("low", left < 4000);
      $("secs").textContent = `${Math.ceil(left / 1000)}s`;
      if (left <= 0) { clearInterval(timerId); answer(null, null); }
    };
    tick(); timerId = setInterval(tick, 100);
  }

  function submitTyped() {
    const v = $("answerInput").value;
    if (v === "" || round.locked) return;
    answer(parseInt(v, 10), null);
  }

  function answer(value, btn) {
    if (round.locked) return;
    round.locked = true; clearInterval(timerId);
    const p = round.p, right = value === p.ans;
    round.results[round.i] = right;
    const fact = `${p.a} ${p.op === "+" ? "+" : MINUS} ${p.b} = ${p.ans}`;
    const fb = $("feedback");
    if (right) {
      round.score++; sounds.right();
      fb.textContent = ["Yes!", "You got it!", "Nice!", "Super!"][rand(0, 3)]; fb.className = "feedback good";
      if (btn) btn.classList.add("is-right");
      $("problem").classList.remove("pop"); void $("problem").offsetWidth; $("problem").classList.add("pop");
    } else {
      sounds.wrong(); round.misses.push(fact);
      fb.textContent = value === null ? `Time’s up! ${fact}` : fact; fb.className = "feedback bad";
      if (btn) btn.classList.add("is-wrong");
      [...$("choices").children].forEach(c => { if (+c.textContent === p.ans) c.classList.add("is-right"); });
    }
    paintDots();
    setTimeout(() => { round.i++; nextQuestion(); }, right ? 800 : 2200);
  }

  function finishRound() {
    const passed = round.score >= PASS;
    $("score").textContent = `${round.score} / ${ROUND_LEN}`;
    $("stars").textContent = "⭐".repeat(round.score) + "☆".repeat(ROUND_LEN - round.score);
    let msg;
    if (passed && (save.streak || 0) + 1 < STREAK_NEEDED) {
      sounds.right();
      save.streak = (save.streak || 0) + 1; persist();
      const left = STREAK_NEEDED - save.streak;
      msg = `Great round! ${left} more in a row to climb higher.`;
    } else if (passed) {
      sounds.win(); save.streak = 0;
      if (save.stage < STAGES.length - 1) {
        save.stage++;
        msg = save.stage === STAGES.length - 1
          ? "Great job! Next time you’ll type the answers yourself."
          : `Great job! Next time you get ${STAGES[save.stage].choices} choices.`;
      } else if (save.level < LEVELS.length - 1) {
        save.level++; save.stage = 0;
        msg = `You climbed to Level ${save.level + 1}: ${LEVELS[save.level].name}!`;
      } else {
        msg = "You reached the top of the mountain! Keep practicing to stay sharp.";
      }
      persist();
    } else if (round.score < DROP && save.stage > 0) {
      save.stage = 0; save.streak = 0; persist();
      msg = "Let’s practice with 3 choices for a bit, then climb again.";
    } else {
      const hadStreak = save.streak > 0;
      save.streak = 0; persist();
      msg = (hadStreak ? "Your streak starts over. " : "") +
        `Get ${PASS} right ${STREAK_NEEDED} rounds in a row to climb higher.`;
    }
    $("resultMsg").textContent = msg;
    $("misses").classList.toggle("hidden", round.misses.length === 0);
    $("missList").innerHTML = round.misses.map(m => `<li>${m}</li>`).join("");
    show("result");
  }

  $("switchMode").addEventListener("click", () => {
    if (round.locked) return;
    round.typing = !round.typing; clearInterval(timerId);
    round.i = round.i; // same question slot, fresh problem
    nextQuestion();
  });
  $("startBtn").addEventListener("click", startRound);
  $("againBtn").addEventListener("click", startRound);
  $("homeBtn").addEventListener("click", () => { paintStart(); show("start"); });

  paintMute(); paintStart();
})();
</script>
</body>
</html>
