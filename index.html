<!DOCTYPE html>
<html lang="en" data-skin="unicorn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Time!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Colors match the theme she picked in the spelling game (frog, unicorn or dino) */
:root{
  --bg:#BFE7E0; --accent:#2B8C8C; --btn:#5DBB63; --btn-dark:#3E8E45;
  --card:#FFFFFF; --ink:#1E3A40; --muted:#4F6E73;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-skin="unicorn"]{--bg:#F6E8FF;--accent:#8B4FD6;--btn:#FF78B5;--btn-dark:#D2468A;--ink:#3B2457;--muted:#6E5689}
:root[data-skin="dino"]{--bg:#F3E7C9;--accent:#2E7A4B;--btn:#E8813A;--btn-dark:#B35A1B;--ink:#3A2A14;--muted:#6D5838}
@media (prefers-color-scheme:dark){
  :root{--bg:#123B3D;--accent:#5CC8C2;--btn-dark:#2F6E35;--card:#1B2D30;--ink:#E8F6F3;--muted:#A5C4C2;color-scheme:dark}
  :root[data-skin="unicorn"]{--bg:#2A1840;--accent:#C9A2FF;--btn-dark:#A8336D;--card:#3A2456;--ink:#F7ECFF;--muted:#CDB8E6}
  :root[data-skin="dino"]{--bg:#2A2214;--accent:#7FCB95;--btn-dark:#8F4510;--card:#3A2F1E;--ink:#F6EBD6;--muted:#CDBB98}
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
}
main{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 2.5rem}
header{text-align:center;margin-bottom:1.5rem}
.wave{font-size:clamp(3.5rem,12vw,5.5rem);line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-size:clamp(2.4rem,8vw,4rem);line-height:1;margin:.4rem 0 .3rem;color:var(--accent);font-weight:800}
header p{font-size:clamp(1.2rem,3.5vw,1.5rem);margin:0;color:var(--muted);font-weight:600}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem}
.game{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
  text-decoration:none;color:var(--ink);text-align:center;
  background:var(--card);border:4px solid var(--btn);border-radius:36px 36px 36px 12px;
  padding:1.6rem 1.2rem 1.4rem;min-height:260px;
  box-shadow:0 8px 0 var(--btn-dark);
  transition:transform .1s, box-shadow .1s;
  -webkit-tap-highlight-color:transparent;
}
.game:active{transform:translateY(6px);box-shadow:0 2px 0 var(--btn-dark)}
.game:focus-visible{outline:5px solid #FFD23F;outline-offset:4px}
.game .icon{font-size:clamp(4.5rem,14vw,6.5rem);line-height:1}
.game strong{font-size:clamp(1.8rem,5vw,2.3rem);line-height:1.1;font-weight:800}
.game span.what{font-size:1.2rem;color:var(--muted);font-weight:600}
.game span.play{
  margin-top:.6rem;background:var(--btn);color:#fff;border-radius:999px;
  padding:.3rem 1.6rem;font-size:1.4rem;font-weight:800;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="wave" id="wave" aria-hidden="true">🦄</div>
    <!-- Change the name here if you like, e.g. "Emma’s Games" -->
    <h1>Game Time!</h1>
    <p>What do you want to play?</p>
  </header>

  <!-- To add a new game later, copy one <a class="game"> block and change the link, icon and words -->
  <nav class="games" aria-label="Games">
    <a class="game" href="froghopspelling.html">
      <span class="icon" id="spellIcon" aria-hidden="true">🦄</span>
      <strong>Spelling</strong>
      <span class="what">Practice this week’s words</span>
      <span class="play">Play ▶</span>
    </a>
    <a class="game" href="mathclimb.html">
      <span class="icon" aria-hidden="true">🧗</span>
      <strong>Math Climb</strong>
      <span class="what">Practice math facts</span>
      <span class="play">Play ▶</span>
    </a>
  </nav>
</main>

<script>
// Use the same look she chose in the spelling game
(function(){
  var skin = "unicorn";
  try{ var v = localStorage.getItem("frogspell-skin"); if(v) skin = JSON.parse(v); }catch(e){}
  var icons = {pond:"🐸", unicorn:"🦄", dino:"🦖"};
  if(!icons[skin]) skin = "unicorn";
  document.documentElement.setAttribute("data-skin", skin);
  document.getElementById("wave").textContent = icons[skin];
  document.getElementById("spellIcon").textContent = icons[skin];
})();
</script>
</body>
</html>
